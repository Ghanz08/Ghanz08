name: stats
on:
  schedule: [{ cron: "17 3 * * *" }]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/stats.mjs, scripts/board.mjs, scripts/theme.mjs, .github/workflows/stats.yml]
permissions:
  contents: write
concurrency: { group: stats, cancel-in-progress: true }
jobs:
  stats:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/stats.mjs
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Simpan bila berubah
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-dark.svg assets/stats-light.svg assets/board-dark.svg assets/board-light.svg
          git diff --cached --quiet && exit 0
          git commit -m "stats: perbarui aktivitas"
          git push
