<svg xmlns="http://www.w3.org/2000/svg" width="440" height="186" viewBox="0 0 440 186" role="img">
<style>
text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes appear{from{opacity:0;transform:translateY(6px)}}
@keyframes blink{50%{opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.4)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<title>Glideslope</title>
<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs>
<rect x=".5" y=".5" width="439" height="185" rx="14" fill="#161b22" stroke="#30363d"/>
<rect x="0" y="0" width="6" height="186" rx="3" fill="url(#g)"/>
<text class="m" x="28" y="34" font-size="10.5" letter-spacing="1" fill="#8b949e">FULL-STACK</text>
<text class="m" x="412" y="34" font-size="10.5" fill="#8b949e" text-anchor="end">repo</text>
<text x="28" y="64" font-size="21" font-weight="700" fill="#e6edf3" letter-spacing="-.3">Glideslope</text>
<text x="28" y="90" font-size="12.5" fill="#8b949e">Personal finance that turns bank emails and receipt photos</text><text x="28" y="108" font-size="12.5" fill="#8b949e">into transactions you confirm, so the books keep themselves.</text>
<rect x="28" y="148" width="63" height="22" rx="11" fill="#1c2140"/><text class="m" x="59.5" y="163" font-size="10.5" fill="#818cf8" text-anchor="middle">Next.js</text><rect x="97" y="148" width="31" height="22" rx="11" fill="#1c2140"/><text class="m" x="112.5" y="163" font-size="10.5" fill="#818cf8" text-anchor="middle">Go</text><rect x="134" y="148" width="69" height="22" rx="11" fill="#1c2140"/><text class="m" x="168.5" y="163" font-size="10.5" fill="#818cf8" text-anchor="middle">Supabase</text><rect x="209" y="148" width="37" height="22" rx="11" fill="#1c2140"/><text class="m" x="227.5" y="163" font-size="10.5" fill="#818cf8" text-anchor="middle">OCR</text>
