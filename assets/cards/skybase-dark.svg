<svg xmlns="http://www.w3.org/2000/svg" width="440" height="186" viewBox="0 0 440 186" role="img">
<style>
text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes appear{from{opacity:0;transform:translateY(6px)}}
@keyframes blink{50%{opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.4)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<title>Skybase</title>
<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs>
<rect x=".5" y=".5" width="439" height="185" rx="14" fill="#161b22" stroke="#30363d"/>
<rect x="0" y="0" width="6" height="186" rx="3" fill="url(#g)"/>
<text class="m" x="28" y="34" font-size="10.5" letter-spacing="1" fill="#8b949e">BACKEND</text>
<text class="m" x="412" y="34" font-size="10.5" fill="#8b949e" text-anchor="end">case study</text>
<text x="28" y="64" font-size="21" font-weight="700" fill="#e6edf3" letter-spacing="-.3">Skybase</text>
<text x="28" y="90" font-size="12.5" fill="#8b949e">Aircraft parts inventory and warehouse system. Row-level</text><text x="28" y="108" font-size="12.5" fill="#8b949e">locks keep stock exact when several people check out at</text><text x="28" y="126" font-size="12.5" fill="#8b949e">once.</text>
<rect x="28" y="148" width="82" height="22" rx="11" fill="#1c2140"/><text class="m" x="69" y="163" font-size="10.5" fill="#818cf8" text-anchor="middle">Laravel 11</text><rect x="116" y="148" width="50" height="22" rx="11" fill="#1c2140"/><text class="m" x="141" y="163" font-size="10.5" fill="#818cf8" text-anchor="middle">MySQL</text><rect x="172" y="148" width="50" height="22" rx="11" fill="#1c2140"/><text class="m" x="197" y="163" font-size="10.5" fill="#818cf8" text-anchor="middle">Redis</text><rect x="228" y="148" width="44" height="22" rx="11" fill="#1c2140"/><text class="m" x="250" y="163" font-size="10.5" fill="#818cf8" text-anchor="middle">RBAC</text>
</svg>
