<title>Kost 3g</title>
<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16855a"/><stop offset="1" stop-color="#d97706"/></linearGradient></defs>
<rect x=".5" y=".5" width="439" height="185" rx="14" fill="#161b22" stroke="#30363d"/>
<rect x="0" y="0" width="6" height="186" rx="3" fill="url(#g)"/>
<text class="m" x="28" y="34" font-size="10.5" letter-spacing="1" fill="#8b949e">FULL-STACK</text>
<text class="m" x="412" y="34" font-size="10.5" fill="#34d399" text-anchor="end">● live</text>
<text x="28" y="64" font-size="21" font-weight="700" fill="#e6edf3" letter-spacing="-.3">Kost 3g</text>
<text x="28" y="90" font-size="12.5" fill="#8b949e">Website and admin panel for a real 7-room boarding house:</text><text x="28" y="108" font-size="12.5" fill="#8b949e">rooms, tenants, leases, finances and a lead inbox.</text><text x="28" y="126" font-size="12.5" fill="#8b949e">Self-hosted, with CI/CD.</text>
