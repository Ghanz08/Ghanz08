@keyframes appear{from{opacity:0;transform:translateY(6px)}}
@keyframes blink{50%{opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
@keyframes flap{0%{opacity:0;transform:scaleY(0)}55%{opacity:1;transform:scaleY(1.06)}100%{transform:scaleY(1)}}
.f{transform-box:fill-box;transform-origin:center;animation:flap .55s ease-out both}
