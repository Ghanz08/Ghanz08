<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img">
<style>
text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes appear{from{opacity:0;transform:translateY(6px)}}
@keyframes blink{50%{opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.4)}}

.cov{animation:type .8s .7s steps(8) both}
@keyframes type{to{transform:translateX(70px)}}
.strike{stroke-dasharray:400;stroke-dashoffset:400;animation:draw .6s 1.1s ease-out forwards}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
