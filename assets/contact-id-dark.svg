<svg xmlns="http://www.w3.org/2000/svg" width="960" height="230" viewBox="0 0 960 230" role="img">
<style>
text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes appear{from{opacity:0;transform:translateY(6px)}}
@keyframes blink{50%{opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
@keyframes run{0%{opacity:.15}20%{opacity:1}60%,100%{opacity:.15}}
@keyframes pulse{0%{r:5;opacity:.8}100%{r:13;opacity:0}}.pulse{animation:pulse 1.8s ease-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<title>Punya alur kerja berantakan? Kita bikin jadi andal.</title><defs><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#161b22"/></pattern></defs>
<rect x=".5" y=".5" width="959" height="229" rx="16" fill="#0d1117" stroke="#30363d"/><rect x="1" y="1" width="958" height="228" rx="16" fill="url(#g)"/>
<g style="animation:appear .5s .1s ease-out both">
<text class="m" x="48" y="52" font-size="13" fill="#8b949e">siap lepas landas?</text>
<circle cx="53" cy="80" r="5" fill="#34d399"/><circle class="pulse" cx="53" cy="80" r="5" fill="none" stroke="#34d399" stroke-width="1.5"/>
<text class="m" x="68" y="84" font-size="13" font-weight="700" fill="#34d399">terbuka untuk peluang</text></g>
<text x="48" y="130" font-size="40" font-weight="700" fill="#e6edf3" letter-spacing="-1" style="animation:appear .5s .4s ease-out both">Punya alur kerja berantakan?</text>
<g style="animation:appear .5s .7s ease-out both"><rect x="48" y="192" width="429" height="8" rx="4" fill="#4f46e5" opacity=".35"/>
