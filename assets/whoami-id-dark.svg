<svg xmlns="http://www.w3.org/2000/svg" width="960" height="180" viewBox="0 0 960 180" role="img">
<style>
text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes appear{from{opacity:0;transform:translateY(6px)}}
@keyframes blink{50%{opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
.cov{animation:type .9s .2s steps(16) both}@keyframes type{to{transform:translateX(130px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<title>4+ tahun ngoding, 10+ proyek rilis, Finalis lomba ICT nasional, 4+ organisasi teknologi</title><rect x=".5" y=".5" width="959" height="179" rx="14" fill="#161b22" stroke="#30363d"/>
<circle cx="28" cy="26" r="5" fill="#ff5f57"/><circle cx="46" cy="26" r="5" fill="#febc2e"/><circle cx="64" cy="26" r="5" fill="#28c840"/>
<text class="m" x="92" y="30" font-size="12" fill="#34d399">➜</text>
<text class="m" x="108" y="30" font-size="12" font-weight="700" fill="#818cf8">~</text>
<text class="m" x="120" y="30" font-size="12" font-weight="700" fill="#e6edf3">$ whoami --stats</text>
<rect class="cov" x="118" y="16" width="130" height="20" fill="#161b22"/>
<line x1="1" x2="959" y1="46" y2="46" stroke="#30363d"/><g style="animation:appear .5s 0.90s ease-out both">

<text class="m" x="32" y="72" font-size="10.5" fill="#8b949e">exp.years</text>
<text x="32" y="114" font-size="40" font-weight="700" fill="#e6edf3" letter-spacing="-1">4+</text>
<text x="32" y="137" font-size="13" font-weight="700" fill="#e6edf3">tahun ngoding</text>
<text class="m" x="32" y="155" font-size="10" fill="#8b949e">dan masih debugging</text></g><g style="animation:appear .5s 1.05s ease-out both">
<line x1="246" x2="246" y1="62" y2="164" stroke="#30363d"/>
<text class="m" x="264" y="72" font-size="10.5" fill="#8b949e">projects.built</text>
<text x="264" y="114" font-size="40" font-weight="700" fill="#e6edf3" letter-spacing="-1">10+</text>
<text x="264" y="137" font-size="13" font-weight="700" fill="#e6edf3">proyek rilis</text>
<text class="m" x="264" y="155" font-size="10" fill="#8b949e">dari tugas kuliah sampai pengguna nyata</text></g><g style="animation:appear .5s 1.20s ease-out both">
<line x1="478" x2="478" y1="62" y2="164" stroke="#30363d"/>
<text class="m" x="496" y="72" font-size="10.5" fill="#8b949e">gemastik.xviii</text>
<text x="496" y="114" font-size="32" font-weight="700" fill="#818cf8" letter-spacing="-1">Finalis</text>
<text x="496" y="137" font-size="13" font-weight="700" fill="#e6edf3">lomba ICT nasional</text>
<text class="m" x="496" y="155" font-size="10" fill="#8b949e">GEMASTIK XVIII</text></g><g style="animation:appear .5s 1.35s ease-out both">
<line x1="710" x2="710" y1="62" y2="164" stroke="#30363d"/>
<text class="m" x="728" y="72" font-size="10.5" fill="#8b949e">orgs.joined</text>
<text x="728" y="114" font-size="40" font-weight="700" fill="#e6edf3" letter-spacing="-1">4+</text>
<text x="728" y="137" font-size="13" font-weight="700" fill="#e6edf3">organisasi teknologi</text>
<text class="m" x="728" y="155" font-size="10" fill="#8b949e">membangun bersama orang</text></g>
</svg>
