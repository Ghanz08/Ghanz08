<path d="M70 222 C98.3,208.0 183.0,139.3 240 138 C297.0,136.7 353.7,216.3 412 214 C470.3,211.7 531.7,128.3 590 124 C648.3,119.7 711.7,195.0 762 188" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" class="past"/>
