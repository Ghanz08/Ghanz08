<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img">
<style>
text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes appear{from{opacity:0;transform:translateY(6px)}}
@keyframes blink{50%{opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
.past{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 2.6s .3s ease-out forwards}
.n{transform-box:fill-box;transform-origin:center}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(30px)}}.cloud{animation:drift 14s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<title>Flight route 2021 to 2028: SMK, Jogja Media Web, UGM, TED and GEMASTIK, ASSETS UGM, graduation</title><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#eef0f8"/></pattern></defs>
<rect x=".5" y=".5" width="959" height="299" rx="16" fill="#ffffff" stroke="#e2e5f0"/><rect x="1" y="1" width="958" height="298" rx="16" fill="url(#g)"/>
<g class="cloud" opacity=".5" fill="#eef0ff"><ellipse cx="150" cy="60" rx="70" ry="14"/><ellipse cx="190" cy="52" rx="44" ry="12"/><ellipse cx="640" cy="258" rx="80" ry="13"/><ellipse cx="610" cy="250" rx="44" ry="11"/></g>
<text class="m" x="28" y="34" font-size="10.5" letter-spacing="2" fill="#5b6478">ROUTE · 2021 → 2028</text>
